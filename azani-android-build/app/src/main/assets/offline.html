<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Azani ISP Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef4fb;color:#071f3b;font-family:Arial,sans-serif;padding:24px}.card{max-width:520px;background:#fff;border-radius:22px;padding:34px;box-shadow:0 20px 60px rgba(7,31,59,.15);text-align:center}.icon{width:74px;height:74px;border-radius:20px;background:#0b56e7;color:#fff;display:grid;place-items:center;margin:0 auto 20px;font-size:36px}h1{margin:0 0 12px;font-size:26px}p{line-height:1.6;color:#516173}button{border:0;border-radius:12px;background:#0b56e7;color:#fff;font-weight:700;padding:13px 22px;font-size:15px;cursor:pointer}.brand{margin-top:24px;font-size:12px;color:#728196}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">AZ</div>
    <h1>No internet connection</h1>
    <p>Azani ISP could not reach the online system. Check your mobile data or Wi-Fi connection, then try again.</p>
    <button onclick="location.href='https://www.azaniinternet.online/'">Retry connection</button>
    <div class="brand">Codetech Softwares Solutions™ · Developed by CEO Stephen</div>
  </main>
</body>
</html>
