name: National Revival Desk v4 Flutter Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create project and copy v4 source
        run: |
          set -euo pipefail
          flutter create --platforms=android,web,linux --org org.nationalrevivaldesk --project-name national_revival_desk app
          cp nrd_v4/simple/pubspec.yaml app/pubspec.yaml
          rm -rf app/lib app/test
          cp -a nrd_v4/simple/lib app/lib
          cp -a nrd_v4/simple/test app/test
      - name: Resolve packages
        id: packages
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ../pub-get.log
      - name: Analyze source
        id: analyze
        if: steps.packages.outcome == 'success'
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../analyze.log
      - name: Run tests
        id: tests
        if: steps.packages.outcome == 'success'
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          flutter test 2>&1 | tee ../test.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nrd-v4-simple-diagnostics
          path: |
            pub-get.log
            analyze.log
            test.log
          if-no-files-found: warn
      - name: Enforce results
        if: always()
        run: |
          test '${{ steps.packages.outcome }}' = 'success'
          test '${{ steps.analyze.outcome }}' = 'success'
          test '${{ steps.tests.outcome }}' = 'success'
