name: National Revival Desk v4 Flutter Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create project and copy v4 source
        run: |
          flutter create --platforms=android,web,linux --org org.nationalrevivaldesk --project-name national_revival_desk app
          cp nrd_v4/simple/pubspec.yaml app/pubspec.yaml
          rm -rf app/lib app/test
          cp -a nrd_v4/simple/lib app/lib
          cp -a nrd_v4/simple/test app/test
      - name: Resolve packages
        working-directory: app
        run: flutter pub get
      - name: Analyze source
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        working-directory: app
        run: flutter test
