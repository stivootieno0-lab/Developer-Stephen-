name: National Revival Desk v4 Linux Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build and packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev rpm wget file
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create source-validated Linux project
        run: |
          set -euo pipefail
          flutter create --platforms=android,web,linux --org com.nationalrevivaldesk --project-name national_revival_desk app
          cp nrd_v4/simple/pubspec.yaml app/pubspec.yaml
          rm -rf app/lib app/test
          cp -a nrd_v4/simple/lib app/lib
          cp -a nrd_v4/simple/test app/test
          cd app
          flutter pub get
      - name: Compile native Linux application
        id: compile
        continue-on-error: true
        working-directory: app
        run: flutter build linux --release 2>&1 | tee ../linux-build.log
      - name: Upload Linux compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nrd-v4-linux-compiler-log
          path: linux-build.log
          if-no-files-found: warn
      - name: Enforce Linux compilation
        run: test '${{ steps.compile.outcome }}' = 'success'
      - name: Package portable DEB RPM and AppImage
        run: |
          set -euo pipefail
          mkdir -p release
          BUNDLE="$PWD/app/build/linux/x64/release/bundle"
          test -x "$BUNDLE/national_revival_desk"
          tar -czf release/NationalRevivalDesk-v4.0.0-Linux-Portable-x64.tar.gz -C "$BUNDLE" .
          mkdir -p deb/DEBIAN deb/opt/national-revival-desk deb/usr/bin deb/usr/share/applications deb/usr/share/icons/hicolor/256x256/apps
          cp -a "$BUNDLE/." deb/opt/national-revival-desk/
          ln -s /opt/national-revival-desk/national_revival_desk deb/usr/bin/national-revival-desk
          cp app/linux/runner/resources/app_icon.png deb/usr/share/icons/hicolor/256x256/apps/national-revival-desk.png
          cat > deb/DEBIAN/control <<'EOF'
          Package: national-revival-desk
          Version: 4.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libstdc++6
          Maintainer: National Revival Desk
          Description: National revival coordination, planning, reporting and radio application.
          EOF
          cat > deb/usr/share/applications/national-revival-desk.desktop <<'EOF'
          [Desktop Entry]
          Name=National Revival Desk
          Exec=/opt/national-revival-desk/national_revival_desk
          Icon=national-revival-desk
          Type=Application
          Categories=Office;Utility;
          Terminal=false
          EOF
          dpkg-deb --build deb release/NationalRevivalDesk-v4.0.0-amd64.deb
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          tar -czf rpmbuild/SOURCES/national-revival-desk-4.0.0.tar.gz -C "$BUNDLE" .
          cat > rpmbuild/SPECS/national-revival-desk.spec <<'EOF'
          Name: national-revival-desk
          Version: 4.0.0
          Release: 1%{?dist}
          Summary: National revival coordination and reporting application
          License: Proprietary
          BuildArch: x86_64
          Source0: national-revival-desk-4.0.0.tar.gz
          Requires: gtk3
          %description
          National Revival Desk multi-platform application.
          %install
          mkdir -p %{buildroot}/opt/national-revival-desk %{buildroot}/usr/bin
          tar -xzf %{SOURCE0} -C %{buildroot}/opt/national-revival-desk
          ln -s /opt/national-revival-desk/national_revival_desk %{buildroot}/usr/bin/national-revival-desk
          %files
          /opt/national-revival-desk
          /usr/bin/national-revival-desk
          EOF
          rpmbuild --define "_topdir $PWD/rpmbuild" -bb rpmbuild/SPECS/national-revival-desk.spec
          find rpmbuild/RPMS -name '*.rpm' -exec cp {} release/NationalRevivalDesk-v4.0.0-x86_64.rpm \;
          mkdir -p AppDir/usr/bin
          cp -a "$BUNDLE/." AppDir/usr/bin/
          cp app/linux/runner/resources/app_icon.png AppDir/national-revival-desk.png
          cp deb/usr/share/applications/national-revival-desk.desktop AppDir/national-revival-desk.desktop
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:${LD_LIBRARY_PATH:-}"
          exec "$HERE/usr/bin/national_revival_desk" "$@"
          EOF
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir release/NationalRevivalDesk-v4.0.0-x86_64.AppImage
          cat > release/LINUX_BUILD_STATUS.txt <<'EOF'
          Native Flutter Linux x64 compilation: PASSED
          Shared Flutter analyzer and tests: PASSED in mandatory diagnostics workflow for this release commit
          Portable TAR.GZ: CREATED
          DEB: CREATED
          RPM: CREATED
          AppImage: CREATED
          Runtime testing on the user's Linux distribution: NOT PERFORMED IN CI
          EOF
          sha256sum release/* > release/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nrd-v4-linux
          path: release
          if-no-files-found: error
