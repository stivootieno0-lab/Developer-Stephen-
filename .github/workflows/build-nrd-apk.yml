name: Build National Revival Desk APK

on:
  push:
    branches:
      - nrd-apk-build-v3.1.0
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile release APK
        working-directory: nrd-android-v3.1
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Prepare unsigned release and Android signing tools
        working-directory: nrd-android-v3.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release-unsigned.apk release/NationalRevivalDesk-v3.3.0-unsigned.apk
          cp -a "$ANDROID_HOME/build-tools/35.0.0" release/android-build-tools-35.0.0
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release/NationalRevivalDesk-v3.3.0-unsigned.apk | tee release/APK_UNSIGNED_PACKAGE_REPORT.txt
          sha256sum release/NationalRevivalDesk-v3.3.0-unsigned.apk | tee release/NationalRevivalDesk-v3.3.0-unsigned.apk.sha256

      - name: Upload unsigned build and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: NationalRevivalDesk-v3.3.0-Unsigned-With-Build-Tools
          path: nrd-android-v3.1/release/
          if-no-files-found: error
          retention-days: 7
