name: Build Azani ISP APK

on:
  push:
    branches:
      - azani-apk-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed debug APK
        working-directory: azani-android-build
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare download file
        run: |
          mkdir -p dist
          cp azani-android-build/app/build/outputs/apk/debug/app-debug.apk dist/Azani-ISP-v1.0.0.apk
          sha256sum dist/Azani-ISP-v1.0.0.apk > dist/Azani-ISP-v1.0.0.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Azani-ISP-v1.0.0-Android
          path: dist/
          if-no-files-found: error
          retention-days: 14
