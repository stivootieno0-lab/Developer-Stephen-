name: Build Stichat v2 Native APK

on:
  push:
    branches:
      - stichat-v2-apk-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify Android source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            stichat-v2-build/part-00.b64 \
            stichat-v2-build/part-01.b64 \
            stichat-v2-build/tail-00.b64 \
            stichat-v2-build/tail-01-00.b64 \
            stichat-v2-build/tail-01-01.b64 \
            stichat-v2-build/tail-01-02.b64 \
            stichat-v2-build/tail-02.b64 > Stichat-v2-android-source.b64
          base64 --decode Stichat-v2-android-source.b64 > Stichat-v2-android-source.zip
          echo "86ae56a3466cc42d50fe0299c4da4e6bbb62c692ffcddae80877014b59d5d449  Stichat-v2-android-source.zip" | sha256sum --check
          unzip -qo Stichat-v2-android-source.zip
          cat > android-source/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          sed -i '/import java.util.Locale;/a import java.util.List;' android-source/app/src/main/java/com/stichat/app/ChatActivity.java
          test -f android-source/app/src/main/AndroidManifest.xml
          test -f android-source/app/src/main/java/com/stichat/app/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build and emulator components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile native debug APK
        working-directory: android-source
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Create Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo no | avdmanager create avd -n stichat-ci -k "system-images;android-35;google_apis;x86_64" --force
          sudo chmod 666 /dev/kvm || true
          nohup emulator -avd stichat-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell input keyevent 82 || true

      - name: Install and launch APK smoke test
        shell: bash
        run: |
          set -euo pipefail
          APK="android-source/app/build/outputs/apk/debug/app-debug.apk"
          adb install -r "$APK"
          adb logcat -c
          adb shell am force-stop com.stichat.app.debug || true
          adb shell am start -W -n com.stichat.app.debug/com.stichat.app.MainActivity | tee launch-result.txt
          sleep 8
          adb logcat -d -v threadtime > startup-logcat.txt
          adb shell pidof com.stichat.app.debug > app-pid.txt || true
          if grep -E "FATAL EXCEPTION|AndroidRuntime.*Process: com\.stichat\.app\.debug" startup-logcat.txt; then
            echo "Startup crash detected"
            exit 1
          fi
          if [ ! -s app-pid.txt ]; then
            echo "App process is not alive after launch"
            exit 1
          fi

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stichat-v2-startup-diagnostics
          path: |
            emulator.log
            launch-result.txt
            startup-logcat.txt
            app-pid.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-source/app/build/outputs/apk/debug/app-debug.apk dist/Stichat-v2.0.1-native-debug.apk
          file dist/Stichat-v2.0.1-native-debug.apk
          unzip -t dist/Stichat-v2.0.1-native-debug.apk >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/Stichat-v2.0.1-native-debug.apk
          sha256sum dist/Stichat-v2.0.1-native-debug.apk | tee dist/Stichat-v2.0.1-native-debug.apk.sha256

      - name: Upload installable native APK
        uses: actions/upload-artifact@v4
        with:
          name: Stichat-v2.0.1-native-debug-apk
          path: |
            dist/Stichat-v2.0.1-native-debug.apk
            dist/Stichat-v2.0.1-native-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
