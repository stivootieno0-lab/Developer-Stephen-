name: Build Stichat v2 Native APK

on:
  push:
    branches:
      - stichat-v2-apk-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Reconstruct and patch Android source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            stichat-v2-build/part-00.b64 \
            stichat-v2-build/part-01.b64 \
            stichat-v2-build/tail-00.b64 \
            stichat-v2-build/tail-01-00.b64 \
            stichat-v2-build/tail-01-01.b64 \
            stichat-v2-build/tail-01-02.b64 \
            stichat-v2-build/tail-02.b64 > Stichat-v2-android-source.b64
          base64 --decode Stichat-v2-android-source.b64 > Stichat-v2-android-source.zip
          echo "86ae56a3466cc42d50fe0299c4da4e6bbb62c692ffcddae80877014b59d5d449  Stichat-v2-android-source.zip" | sha256sum --check
          unzip -qo Stichat-v2-android-source.zip
          cp stichat-v2-build/StichatApp.fixed.java android-source/app/src/main/java/com/stichat/app/StichatApp.java
          sed -i "s/versionCode 20/versionCode 21/; s/versionName '2.0.0'/versionName '2.0.1'/" android-source/app/build.gradle
          cat > android-source/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          grep -q '^import java.util.List;' android-source/app/src/main/java/com/stichat/app/ChatActivity.java || sed -i '/import java.util.Locale;/a import java.util.List;' android-source/app/src/main/java/com/stichat/app/ChatActivity.java
          test -f android-source/app/src/main/AndroidManifest.xml
          test -f android-source/app/src/main/java/com/stichat/app/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile native debug APK
        working-directory: android-source
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare startup smoke test
        shell: bash
        run: |
          cat > smoke-test.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          APK="android-source/app/build/outputs/apk/debug/app-debug.apk"
          adb install -r "$APK"
          adb logcat -c
          adb shell am force-stop com.stichat.app.debug || true
          adb shell am start -W -n com.stichat.app.debug/com.stichat.app.MainActivity | tee launch-result.txt
          sleep 10
          adb logcat -d -v threadtime > startup-logcat.txt
          adb shell pidof com.stichat.app.debug > app-pid.txt || true
          grep -E "FATAL EXCEPTION|AndroidRuntime.*Process: com\.stichat\.app\.debug" startup-logcat.txt > fatal-startup.txt || true
          if [ -s fatal-startup.txt ]; then
            cat fatal-startup.txt
            exit 1
          fi
          if [ ! -s app-pid.txt ]; then
            echo "App process is not alive after launch"
            exit 1
          fi
          echo "Stichat process $(cat app-pid.txt) remained alive after startup."
          EOF
          chmod +x smoke-test.sh

      - name: Install and launch on Android 15 emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: ./smoke-test.sh

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stichat-v2.0.1-startup-diagnostics
          path: |
            launch-result.txt
            startup-logcat.txt
            fatal-startup.txt
            app-pid.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-source/app/build/outputs/apk/debug/app-debug.apk dist/Stichat-v2.0.1-native-debug.apk
          file dist/Stichat-v2.0.1-native-debug.apk
          unzip -t dist/Stichat-v2.0.1-native-debug.apk >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/Stichat-v2.0.1-native-debug.apk
          sha256sum dist/Stichat-v2.0.1-native-debug.apk | tee dist/Stichat-v2.0.1-native-debug.apk.sha256

      - name: Upload installable native APK
        uses: actions/upload-artifact@v4
        with:
          name: Stichat-v2.0.1-native-debug-apk
          path: |
            dist/Stichat-v2.0.1-native-debug.apk
            dist/Stichat-v2.0.1-native-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
