name: Extract StiCode v4 Source

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild source project
        run: |
          cat chunks/source.*.b64 | base64 --decode > /tmp/sticode-source.zip
          unzip -t /tmp/sticode-source.zip
          mkdir -p /tmp/sticode-source
          unzip -q /tmp/sticode-source.zip -d /tmp/sticode-source
      - uses: actions/upload-artifact@v4
        with:
          name: sticode-v3-source-extracted
          path: /tmp/sticode-source
          if-no-files-found: error
