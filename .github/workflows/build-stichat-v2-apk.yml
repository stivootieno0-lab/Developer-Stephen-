name: Build Stichat v2 Native APK

on:
  push:
    branches:
      - stichat-v2-apk-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify Android source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            stichat-v2-build/part-00.b64 \
            stichat-v2-build/part-01.b64 \
            stichat-v2-build/tail-00.b64 \
            stichat-v2-build/tail-01.b64 \
            stichat-v2-build/tail-02.b64 > Stichat-v2-android-source.b64
          base64 --decode Stichat-v2-android-source.b64 > Stichat-v2-android-source.zip
          echo "86ae56a3466cc42d50fe0299c4da4e6bbb62c692ffcddae80877014b59d5d449  Stichat-v2-android-source.zip" | sha256sum --check
          unzip -qo Stichat-v2-android-source.zip
          test -f android-source/app/src/main/AndroidManifest.xml
          test -f android-source/app/src/main/java/com/stichat/app/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile native debug APK
        working-directory: android-source
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-source/app/build/outputs/apk/debug/app-debug.apk dist/Stichat-v2.0.0-native-debug.apk
          file dist/Stichat-v2.0.0-native-debug.apk
          unzip -t dist/Stichat-v2.0.0-native-debug.apk >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/Stichat-v2.0.0-native-debug.apk
          sha256sum dist/Stichat-v2.0.0-native-debug.apk | tee dist/Stichat-v2.0.0-native-debug.apk.sha256

      - name: Upload installable native APK
        uses: actions/upload-artifact@v4
        with:
          name: Stichat-v2.0.0-native-debug-apk
          path: |
            dist/Stichat-v2.0.0-native-debug.apk
            dist/Stichat-v2.0.0-native-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
