name: Build Stevo Mega v4 Corrected

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct verified source and command patch
        run: |
          set -euo pipefail
          cat chunks/source.*.b64 | base64 --decode > /tmp/sticode-v3.zip
          unzip -t /tmp/sticode-v3.zip
          mkdir -p /tmp/source
          unzip -q /tmp/sticode-v3.zip -d /tmp/source

          cat v4-final/patch.gz.b64.* > /tmp/remote-patch.gz.b64
          cat v4-correction/correction.b64.* > /tmp/correction.json.gz.b64
          echo 'bf492de8d39445a79c5dc9af3b11f8b4e3648819805e2b3325dfd384c32c8cdd  /tmp/correction.json.gz.b64' | sha256sum --check
          base64 --decode /tmp/correction.json.gz.b64 | gzip --decompress > /tmp/correction.json
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          target = Path('/tmp/remote-patch.gz.b64')
          data = bytearray(target.read_bytes())
          operations = json.loads(Path('/tmp/correction.json').read_text())
          for operation in reversed(operations):
              data[operation['i1']:operation['i2']] = base64.b64decode(operation['data'])
          target.write_bytes(data)
          PY
          echo '4884a1732aaac24e9c6a14578b75d397ba7699df7be0734d1a432458eaa28365  /tmp/remote-patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/remote-patch.gz.b64 > /tmp/stevo-v4.patch.gz
          echo 'dea9be688de86cde76ab674eecb9e3f3c8a54e1a5fb1fa0a499909a0ebbf4952  /tmp/stevo-v4.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/stevo-v4.patch.gz > /tmp/stevo-v4.patch
          echo 'd09ea75926863c1a3e49f2a02e022ff364572b4afd0e2e20cca891b0bb1e4cd1  /tmp/stevo-v4.patch' | sha256sum --check

          cd /tmp/source/StiCode-Android-v3.0.0
          patch -p1 < /tmp/stevo-v4.patch
          grep -q "applicationId 'com.codetech.sticode.mega'" app/build.gradle
          grep -q "versionName '4.0.0'" app/build.gradle
          grep -q 'ESTIMATED_PHRASE_VARIATIONS = 8_640_000L' app/src/main/java/com/codetech/sticode/MegaCommandRouter.java
          cd /tmp/source
          mv StiCode-Android-v3.0.0 Stevo-Mega-Android-v4.0.0
          zip -qr /tmp/Stevo-Mega-Android-v4.0.0-Source.zip Stevo-Mega-Android-v4.0.0

      - name: Build Android release
        working-directory: /tmp/source/Stevo-Mega-Android-v4.0.0
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee /tmp/stevo-v4-build.log

      - name: Sign and validate release
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          PASS=$(openssl rand -hex 24)
          keytool -genkeypair -v \
            -keystore /tmp/release/stevo-mega-release.jks \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias stevomega \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname 'CN=Stevo Mega, OU=CodeTech Software Solutions, O=CodeTech Software Solutions, L=Nairobi, ST=Nairobi, C=KE'
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=/tmp/source/Stevo-Mega-Android-v4.0.0/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" /tmp/release/Stevo-Mega-v4.0.0-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/release/stevo-mega-release.jks \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --ks-key-alias stevomega \
            --out /tmp/release/Stevo-Mega-v4.0.0.apk \
            /tmp/release/Stevo-Mega-v4.0.0-aligned.apk
          "$BUILD_TOOLS/zipalign" -c -p 4 /tmp/release/Stevo-Mega-v4.0.0.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs /tmp/release/Stevo-Mega-v4.0.0.apk > /tmp/release/APK-SIGNATURE.txt
          "$BUILD_TOOLS/aapt2" dump badging /tmp/release/Stevo-Mega-v4.0.0.apk > /tmp/release/APK-BADGING.txt
          unzip -t /tmp/release/Stevo-Mega-v4.0.0.apk > /tmp/release/APK-ZIP-TEST.txt
          sha256sum /tmp/release/Stevo-Mega-v4.0.0.apk > /tmp/release/Stevo-Mega-v4.0.0.sha256
          cp /tmp/Stevo-Mega-Android-v4.0.0-Source.zip /tmp/release/
          cp /tmp/stevo-v4-build.log /tmp/release/COMPILER-LOG.txt
          printf 'Alias: stevomega\nStore password: %s\nKey password: %s\nKeep this signing key private.\n' "$PASS" "$PASS" > /tmp/release/KEEP-PRIVATE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: stevo-mega-v4-corrected-release
          path: /tmp/release
          if-no-files-found: error

      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stevo-mega-v4-corrected-compiler-log
          path: /tmp/stevo-v4-build.log
          if-no-files-found: ignore
