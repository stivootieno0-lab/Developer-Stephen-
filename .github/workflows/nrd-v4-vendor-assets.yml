name: National Revival Desk v4 Vendor Assets
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned production assets
        run: |
          set -euo pipefail
          mkdir -p vendor/bootstrap vendor/bootstrap-icons/fonts vendor/chartjs
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css -o vendor/bootstrap/bootstrap.min.css
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js -o vendor/bootstrap/bootstrap.bundle.min.js
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css -o vendor/bootstrap-icons/bootstrap-icons.min.css
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/fonts/bootstrap-icons.woff2 -o vendor/bootstrap-icons/fonts/bootstrap-icons.woff2
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/fonts/bootstrap-icons.woff -o vendor/bootstrap-icons/fonts/bootstrap-icons.woff
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js -o vendor/chartjs/chart.umd.min.js
          sha256sum vendor/bootstrap/* vendor/bootstrap-icons/* vendor/bootstrap-icons/fonts/* vendor/chartjs/* > vendor/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nrd-v4-vendor-assets
          path: vendor
          if-no-files-found: error
