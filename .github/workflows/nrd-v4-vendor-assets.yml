name: National Revival Desk v4 Vendor Assets
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned packages and collect local assets
        run: |
          set -euo pipefail
          npm init -y
          npm install --save-exact --ignore-scripts --no-audit --no-fund bootstrap@5.3.3 bootstrap-icons@1.11.3 chart.js@4.4.1
          mkdir -p vendor/bootstrap vendor/bootstrap-icons/fonts vendor/chartjs
          cp node_modules/bootstrap/dist/css/bootstrap.min.css vendor/bootstrap/
          cp node_modules/bootstrap/dist/js/bootstrap.bundle.min.js vendor/bootstrap/
          cp node_modules/bootstrap-icons/font/bootstrap-icons.min.css vendor/bootstrap-icons/
          cp node_modules/bootstrap-icons/font/fonts/bootstrap-icons.woff2 vendor/bootstrap-icons/fonts/
          cp node_modules/bootstrap-icons/font/fonts/bootstrap-icons.woff vendor/bootstrap-icons/fonts/
          cp node_modules/chart.js/dist/chart.umd.js vendor/chartjs/chart.umd.min.js
          find vendor -type f -print0 | sort -z | xargs -0 sha256sum > vendor/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nrd-v4-vendor-assets
          path: vendor
          if-no-files-found: error
