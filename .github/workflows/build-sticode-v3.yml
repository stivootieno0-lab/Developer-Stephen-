name: Build StiCode v3

on:
  push:
    branches: [sticode-v3-stevo]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Rebuild and extract project
        run: |
          cat chunks/source.*.b64 | base64 --decode > source.zip
          unzip -t source.zip
          unzip -q source.zip

      - name: Build unsigned release APK
        working-directory: StiCode-Android-v3.0.0
        run: gradle --no-daemon clean assembleRelease

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp StiCode-Android-v3.0.0/app/build/outputs/apk/release/app-release-unsigned.apk artifact/StiCode-v3.0.0-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" artifact/zipalign
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" artifact/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" artifact/apksigner.jar
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" artifact/aapt2
          chmod +x artifact/zipalign artifact/apksigner artifact/aapt2

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: sticode-v3-build
          path: artifact
          if-no-files-found: error
