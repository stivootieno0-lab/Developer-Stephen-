name: Build CodeTech Portal APKs

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out build request
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct Android source project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          cat .build/portal-parts/part.* | base64 -d > work/codetech-portal-apps.tar.xz
          echo "76e113bcb9aeeeb03e04b549ed3b067b8eeff2722329b19c6564b60b5cbf0a89  work/codetech-portal-apps.tar.xz" | sha256sum -c -
          tar -xJf work/codetech-portal-apps.tar.xz -C work
          test -f work/CodeTech-Portal-Apps-Android-v1.0.0/app/build.gradle

      - name: Install Android API 35 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate private CodeTech signing identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-keys"
          PASSWORD="$(openssl rand -hex 18)"
          KEYSTORE="$GITHUB_WORKSPACE/release-keys/codetech-portal-apps-release.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias codetech-portals \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=CodeTech Portal Apps, OU=Software Engineering, O=CodeTech Softwares Solutions, L=Nairobi, ST=Nairobi, C=KE" >/dev/null 2>&1
          {
            echo "Keystore: codetech-portal-apps-release.jks"
            echo "Alias: codetech-portals"
            echo "Store password: $PASSWORD"
            echo "Key password: $PASSWORD"
            echo "KEEP THIS FILE AND KEYSTORE PRIVATE. Future updates must use this same signing identity."
          } > "$GITHUB_WORKSPACE/release-keys/KEEP-PRIVATE-CREDENTIALS.txt"
          echo "CODETECH_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "CODETECH_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "CODETECH_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "CODETECH_KEY_ALIAS=codetech-portals" >> "$GITHUB_ENV"

      - name: Compile signed release APKs
        working-directory: work/CodeTech-Portal-Apps-Android-v1.0.0
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Collect and verify releases
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/work/CodeTech-Portal-Apps-Android-v1.0.0"
          OUT="$GITHUB_WORKSPACE/output"
          mkdir -p "$OUT/apks" "$OUT/signing-private" "$OUT/source"
          cp "$PROJECT/app/build/outputs/apk/store/release/app-store-release.apk" "$OUT/apks/CodeTech-Store-Android-v1.0.0.apk"
          cp "$PROJECT/app/build/outputs/apk/training/release/app-training-release.apk" "$OUT/apks/CodeTech-Training-Android-v1.0.0.apk"
          cp "$PROJECT/app/build/outputs/apk/support/release/app-support-release.apk" "$OUT/apks/CodeTech-Support-Android-v1.0.0.apk"
          cp "$PROJECT/app/build/outputs/apk/careers/release/app-careers-release.apk" "$OUT/apks/CodeTech-Careers-Android-v1.0.0.apk"
          cp -a "$GITHUB_WORKSPACE/release-keys/." "$OUT/signing-private/"
          cp -a "$PROJECT" "$OUT/source/CodeTech-Portal-Apps-Android-v1.0.0"
          rm -rf "$OUT/source/CodeTech-Portal-Apps-Android-v1.0.0/.gradle" "$OUT/source/CodeTech-Portal-Apps-Android-v1.0.0/app/build"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for apk in "$OUT"/apks/*.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done
          (cd "$OUT" && sha256sum apks/*.apk > SHA256SUMS.txt)
          keytool -list -v -keystore "$OUT/signing-private/codetech-portal-apps-release.jks" \
            -storepass "$CODETECH_KEYSTORE_PASSWORD" -alias codetech-portals | \
            grep -E 'Alias name:|Owner:|SHA256:' > "$OUT/signing-private/CERTIFICATE-FINGERPRINT.txt"

      - name: Upload signed APK bundle
        uses: actions/upload-artifact@v4
        with:
          name: codetech-portal-apks
          path: output
          if-no-files-found: error
          retention-days: 3
