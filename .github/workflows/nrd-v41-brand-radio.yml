name: National Revival Desk v4.1 Brand and Radio

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Flutter project and apply v4.1 overlay
        run: |
          set -euo pipefail
          flutter create --platforms=android,web --org com.nationalrevivaldesk --project-name national_revival_desk app
          git fetch origin nrd-v4-multiplatform-build:nrd-v4-base
          mkdir -p /tmp/v4base
          git archive nrd-v4-base nrd_v4/simple | tar -x -C /tmp/v4base
          rm -rf app/lib app/test
          cp -a /tmp/v4base/nrd_v4/simple/lib app/lib
          cp -a /tmp/v4base/nrd_v4/simple/test app/test
          rm -f app/lib/screens.dart
          cp nrd_v41/pubspec.yaml app/pubspec.yaml
          cp nrd_v41/direct/main.dart app/lib/main.dart
          cp nrd_v41/direct/radio_controller.dart app/lib/radio_controller.dart
          cp nrd_v41/direct/nrd_theme.dart app/lib/nrd_theme.dart
          cat nrd_v41/direct/branded_fixed.00.part nrd_v41/direct/branded_fixed.01.part nrd_v41/direct/branded_fixed.02.part > app/lib/branded_screens.dart
          mkdir -p app/assets/images
          cat nrd_v41/chunks3/logo.00a.b64 nrd_v41/chunks3/logo.00b.b64 nrd_v41/chunks3/logo.01.b64 | base64 --decode > app/assets/images/logo.png
          file app/assets/images/logo.png
          cp nrd_v41/direct/AndroidManifest.xml app/android/app/src/main/AndroidManifest.xml
          sed -i 's/<title>national_revival_desk<\/title>/<title>National Revival Desk<\/title>/' app/web/index.html || true
      - name: Resolve and validate Flutter source
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get 2>&1 | tee ../pub-get.log
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../analyze.log
          flutter test 2>&1 | tee ../test.log
      - name: Compile Android APK
        working-directory: app
        run: |
          set -euo pipefail
          flutter build apk --release --build-name=4.1.0 --build-number=41000 2>&1 | tee ../apk-build.log
      - name: Compile Android AAB
        working-directory: app
        run: |
          set -euo pipefail
          flutter build appbundle --release --build-name=4.1.0 --build-number=41000 2>&1 | tee ../aab-build.log
      - name: Compile offline-first Web PWA
        working-directory: app
        run: |
          set -euo pipefail
          flutter build web --release --pwa-strategy=offline-first 2>&1 | tee ../web-build.log
      - name: Assemble unsigned release and Android signing tools
        run: |
          set -euo pipefail
          mkdir -p release/build-tools release/web
          cp app/build/app/outputs/flutter-apk/app-release.apk release/NationalRevivalDesk-v4.1.0-unsigned.apk
          cp app/build/app/outputs/bundle/release/app-release.aab release/NationalRevivalDesk-v4.1.0-unsigned.aab
          cp -a app/build/web/. release/web/
          tar -czf release/NationalRevivalDesk-v4.1.0-Web-PWA.tar.gz -C app/build/web .
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BUILD_TOOLS=$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          cp -a "$BUILD_TOOLS/." release/build-tools/
          cat > release/BUILD_STATUS.txt <<'EOF'
          Flutter analysis: PASSED
          Flutter tests: PASSED
          Android APK compilation: PASSED
          Android AAB compilation: PASSED
          Web/PWA compilation: PASSED
          Android signing: PENDING owner release key in final assembly
          Physical device installation: NOT PERFORMED IN CI
          Radio implementation: foreground media service through audio_service and just_audio_background
          EOF
          sha256sum release/NationalRevivalDesk-v4.1.0-unsigned.apk release/NationalRevivalDesk-v4.1.0-unsigned.aab release/NationalRevivalDesk-v4.1.0-Web-PWA.tar.gz > release/unsigned-checksums.txt
      - name: Upload v4.1 unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: nrd-v4-1-brand-radio-unsigned-with-tools
          path: release
          if-no-files-found: error
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nrd-v4-1-validation-logs
          path: |
            pub-get.log
            analyze.log
            test.log
            apk-build.log
            aab-build.log
            web-build.log
          if-no-files-found: warn
