name: Build Stevo v5 Compact
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reconstruct
        run: |
          set -euo pipefail
          cat chunks/source.*.b64 | base64 -d > /tmp/base.zip
          mkdir -p /tmp/src && unzip -q /tmp/base.zip -d /tmp/src
          cat v5-xz/patch.xz.b64.* > /tmp/p.xz.b64
          echo '994d68e31fa88101250ab57b870471f5225acd7f7655874499a4675adb419a00  /tmp/p.xz.b64' | sha256sum -c
          base64 -d /tmp/p.xz.b64 > /tmp/p.xz
          echo '0b9d3886670132594953fd3d726e5e12a33776ed5f3dc6f291370386ab0adb58  /tmp/p.xz' | sha256sum -c
          xz -dc /tmp/p.xz > /tmp/p.patch
          echo '023f5b77334f2929a91dfb90bac2631c7349050157b622ae782c9d97e0ee07f3  /tmp/p.patch' | sha256sum -c
          cd /tmp/src/StiCode-Android-v3.0.0
          patch --batch -p4 < /tmp/p.patch
          grep -q "versionName '5.0.0'" app/build.gradle
          grep -q '12_960_000_000L' app/src/main/java/com/codetech/sticode/MegaCommandRouter.java
          cd /tmp/src && mv StiCode-Android-v3.0.0 Stevo-Mega-Android-v5.0.0
          zip -qr /tmp/Stevo-Mega-Android-v5.0.0-Source.zip Stevo-Mega-Android-v5.0.0
      - name: Compile
        working-directory: /tmp/src/Stevo-Mega-Android-v5.0.0
        run: gradle assembleRelease --stacktrace 2>&1 | tee /tmp/build.log
      - name: Retrieve update key
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/key
          curl -fL -H "Authorization: Bearer $TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8448432173/zip" -o /tmp/key.zip
          unzip -q /tmp/key.zip -d /tmp/key
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          KS=$(find /tmp/key -name stevo-mega-release.jks -print -quit)
          NOTE=$(find /tmp/key -name KEEP-PRIVATE.txt -print -quit)
          OLD=$(find /tmp/key -name Stevo-Mega-v4.0.0.apk -print -quit)
          PASS=$(awk -F': ' '/Store password/{print $2; exit}' "$NOTE" | tr -d '\r')
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          U=/tmp/src/Stevo-Mega-Android-v5.0.0/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$U" /tmp/out/aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias stevomega --out /tmp/out/Stevo-Mega-v5.0.0.apk /tmp/out/aligned.apk
          rm /tmp/out/aligned.apk
          "$BT/zipalign" -c -p 4 /tmp/out/Stevo-Mega-v5.0.0.apk
          "$BT/apksigner" verify --verbose --print-certs /tmp/out/Stevo-Mega-v5.0.0.apk > /tmp/out/APK-SIGNATURE.txt
          "$BT/aapt2" dump badging /tmp/out/Stevo-Mega-v5.0.0.apk > /tmp/out/APK-BADGING.txt
          "$BT/apksigner" verify --print-certs "$OLD" > /tmp/old-cert.txt
          A=$(awk -F': ' '/certificate SHA-256 digest/{print $2; exit}' /tmp/old-cert.txt)
          B=$(awk -F': ' '/certificate SHA-256 digest/{print $2; exit}' /tmp/out/APK-SIGNATURE.txt)
          test -n "$A" && test "$A" = "$B"
          printf 'v4=%s\nv5=%s\nmatch=PASS\n' "$A" "$B" > /tmp/out/SIGNER-CHECK.txt
          unzip -t /tmp/out/Stevo-Mega-v5.0.0.apk > /tmp/out/APK-ZIP-TEST.txt
          sha256sum /tmp/out/Stevo-Mega-v5.0.0.apk > /tmp/out/Stevo-Mega-v5.0.0.sha256
          cp /tmp/Stevo-Mega-Android-v5.0.0-Source.zip /tmp/out/
          cp /tmp/build.log /tmp/out/COMPILER-LOG.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stevo-mega-v5-compact-release
          path: /tmp/out
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stevo-v5-compact-log
          path: /tmp/build.log
          if-no-files-found: ignore
