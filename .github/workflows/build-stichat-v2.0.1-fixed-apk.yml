name: Build Stichat v2.0.1 Fixed APK

on:
  push:
    branches:
      - stichat-v2-startup-fix
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fixed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct tested source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            stichat-v2-build/part-00.b64 \
            stichat-v2-build/part-01.b64 \
            stichat-v2-build/tail-00.b64 \
            stichat-v2-build/tail-01-00.b64 \
            stichat-v2-build/tail-01-01.b64 \
            stichat-v2-build/tail-01-02.b64 \
            stichat-v2-build/tail-02.b64 > source.b64
          base64 --decode source.b64 > source.zip
          echo "86ae56a3466cc42d50fe0299c4da4e6bbb62c692ffcddae80877014b59d5d449  source.zip" | sha256sum --check
          unzip -qo source.zip
          cp stichat-v2-build/StichatApp.fixed.java android-source/app/src/main/java/com/stichat/app/StichatApp.java
          sed -i 's/wrapper.addView(editText, new ViewGroup.LayoutParams(/wrapper.addView(editText, new LinearLayout.LayoutParams(/' android-source/app/src/main/java/com/stichat/app/Ui.java
          sed -i "s/versionCode 20/versionCode 21/; s/versionName '2.0.0'/versionName '2.0.1'/" android-source/app/build.gradle
          cat > android-source/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          grep -q '^import java.util.List;' android-source/app/src/main/java/com/stichat/app/ChatActivity.java || sed -i '/import java.util.Locale;/a import java.util.List;' android-source/app/src/main/java/com/stichat/app/ChatActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile fixed native APK
        working-directory: android-source
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-source/app/build/outputs/apk/debug/app-debug.apk dist/Stichat-v2.0.1-startup-fixed.apk
          file dist/Stichat-v2.0.1-startup-fixed.apk
          unzip -t dist/Stichat-v2.0.1-startup-fixed.apk >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/Stichat-v2.0.1-startup-fixed.apk | tee dist/apksigner-verification.txt
          sha256sum dist/Stichat-v2.0.1-startup-fixed.apk | tee dist/Stichat-v2.0.1-startup-fixed.apk.sha256

      - name: Upload corrected APK
        uses: actions/upload-artifact@v4
        with:
          name: Stichat-v2.0.1-startup-fixed-apk
          path: |
            dist/Stichat-v2.0.1-startup-fixed.apk
            dist/Stichat-v2.0.1-startup-fixed.apk.sha256
            dist/apksigner-verification.txt
          if-no-files-found: error
          retention-days: 7
