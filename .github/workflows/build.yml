name: Build CodeTech Camera Suite
on:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode source
        run: |
          python3 - <<'PY'
          import base64, pathlib, zipfile
          root=pathlib.Path('.')
          chunks=sorted(root.glob('suite-source.b64.*'))
          pieces=[]
          alphabet=set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\r\n')
          for part in chunks:
              raw=part.read_bytes()
              if raw and set(raw) <= alphabet:
                  raw=base64.b64decode(raw)
              pieces.append(raw)
          pathlib.Path('/tmp/suite.zip').write_bytes(b''.join(pieces))
          with zipfile.ZipFile('/tmp/suite.zip') as z: z.extractall('/tmp/suite')
          PY
      - name: Build Android release
        working-directory: /tmp/suite/CodeTech-Camera-Suite/android
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee /tmp/android-build.log
      - name: Upload Android compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codetech-camera-android-build-log
          path: /tmp/android-build.log
      - name: Create signing key and sign
        run: |
          mkdir -p /tmp/release/android
          keytool -genkeypair -v -keystore /tmp/release/android/codetech-camera-release.jks -storepass CodeTechCamera2026 -keypass CodeTechCamera2026 -alias codetechcamera -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=CodeTech Camera, OU=CodeTech Software Solutions, O=CodeTech Software Solutions, L=Nairobi, ST=Nairobi, C=KE"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=/tmp/suite/CodeTech-Camera-Suite/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" /tmp/release/android/CodeTech-Camera-Android-v1.0.0-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/release/android/codetech-camera-release.jks --ks-pass pass:CodeTechCamera2026 --key-pass pass:CodeTechCamera2026 --ks-key-alias codetechcamera --out /tmp/release/android/CodeTech-Camera-Android-v1.0.0.apk /tmp/release/android/CodeTech-Camera-Android-v1.0.0-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs /tmp/release/android/CodeTech-Camera-Android-v1.0.0.apk > /tmp/release/android/APK-VALIDATION.txt
          sha256sum /tmp/release/android/CodeTech-Camera-Android-v1.0.0.apk > /tmp/release/android/CodeTech-Camera-Android-v1.0.0.sha256
          cat > /tmp/release/android/KEEP-PRIVATE.txt <<'TXT'
          Keep codetech-camera-release.jks private. Future Android updates must be signed with this same key.
          Alias: codetechcamera
          Store password: CodeTechCamera2026
          Key password: CodeTechCamera2026
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: codetech-camera-android
          path: /tmp/release/android

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode source
        shell: pwsh
        run: |
          @'
          import base64, pathlib, zipfile, os
          root=pathlib.Path('.')
          chunks=sorted(root.glob('suite-source.b64.*'))
          pieces=[]
          alphabet=set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\r\n')
          for part in chunks:
              raw=part.read_bytes()
              if raw and set(raw) <= alphabet:
                  raw=base64.b64decode(raw)
              pieces.append(raw)
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'suite.zip'
          target.write_bytes(b''.join(pieces))
          with zipfile.ZipFile(target) as z: z.extractall(pathlib.Path(os.environ['RUNNER_TEMP'])/'suite')
          '@ | python -
      - name: Build Windows executable
        shell: pwsh
        run: |
          Set-Location "$env:RUNNER_TEMP\suite\CodeTech-Camera-Suite\pc"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pyinstaller --noconfirm --onefile --windowed --name "CodeTech Camera PC" codetech_camera_pc.py
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\release-pc" | Out-Null
          Copy-Item "dist\CodeTech Camera PC.exe" "$env:RUNNER_TEMP\release-pc\CodeTech-Camera-PC-v1.0.0.exe"
          Copy-Item "BUILD_WINDOWS.bat" "$env:RUNNER_TEMP\release-pc\"
          Copy-Item "RUN_FROM_SOURCE.bat" "$env:RUNNER_TEMP\release-pc\"
          Copy-Item "codetech_camera_pc.py" "$env:RUNNER_TEMP\release-pc\"
          Copy-Item "requirements.txt" "$env:RUNNER_TEMP\release-pc\"
          Get-FileHash "$env:RUNNER_TEMP\release-pc\CodeTech-Camera-PC-v1.0.0.exe" -Algorithm SHA256 | Format-List | Out-File "$env:RUNNER_TEMP\release-pc\CodeTech-Camera-PC-v1.0.0.sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: codetech-camera-pc
          path: ${{ runner.temp }}\release-pc
