name: National Revival Desk v4 Desktop and Apple Builds

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: 4.0.0

jobs:
  windows:
    name: Windows EXE and Portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create and validate Windows project
        shell: pwsh
        run: |
          flutter create --platforms=windows --org com.nationalrevivaldesk --project-name national_revival_desk app
          Copy-Item nrd_v4/simple/pubspec.yaml app/pubspec.yaml -Force
          Remove-Item app/lib,app/test -Recurse -Force
          Copy-Item nrd_v4/simple/lib app/lib -Recurse
          Copy-Item nrd_v4/simple/test app/test -Recurse
          Push-Location app
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          flutter build windows --release
          Pop-Location
      - name: Package Windows portable and EXE installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath release/NationalRevivalDesk-v4.0.0-Windows-Portable.zip -Force
          choco install innosetup -y --no-progress
          @'
          [Setup]
          AppName=National Revival Desk
          AppVersion=4.0.0
          DefaultDirName={autopf}\National Revival Desk
          DefaultGroupName=National Revival Desk
          OutputDir=release
          OutputBaseFilename=NationalRevivalDesk-v4.0.0-Windows-Setup-unsigned
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\national_revival_desk.exe
          [Files]
          Source: "app\build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          [Icons]
          Name: "{autoprograms}\National Revival Desk"; Filename: "{app}\national_revival_desk.exe"
          Name: "{autodesktop}\National Revival Desk"; Filename: "{app}\national_revival_desk.exe"; Tasks: desktopicon
          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"
          [Run]
          Filename: "{app}\national_revival_desk.exe"; Description: "Launch National Revival Desk"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content installer.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          @'
          WINDOWS BUILD STATUS
          - Native Flutter Windows x64 build: compiled
          - Portable ZIP: compiled
          - Inno Setup EXE installer: compiled
          - Authenticode publisher signing: NOT APPLIED; owner certificate required
          '@ | Set-Content release/WINDOWS_BUILD_STATUS.txt
          Get-FileHash release/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content release/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nrd-v4-windows
          path: release
          if-no-files-found: error

  linux:
    name: Linux AppImage DEB RPM Portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev rpm wget file
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create, validate and build Linux project
        run: |
          set -euo pipefail
          flutter create --platforms=linux --org com.nationalrevivaldesk --project-name national_revival_desk app
          cp nrd_v4/simple/pubspec.yaml app/pubspec.yaml
          rm -rf app/lib app/test
          cp -a nrd_v4/simple/lib app/lib
          cp -a nrd_v4/simple/test app/test
          cd app
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          flutter build linux --release
      - name: Package portable, DEB, RPM and AppImage
        run: |
          set -euo pipefail
          mkdir -p release
          BUNDLE="$PWD/app/build/linux/x64/release/bundle"
          tar -czf release/NationalRevivalDesk-v4.0.0-Linux-Portable-x64.tar.gz -C "$BUNDLE" .
          mkdir -p deb/DEBIAN deb/opt/national-revival-desk deb/usr/bin deb/usr/share/applications deb/usr/share/icons/hicolor/256x256/apps
          cp -a "$BUNDLE/." deb/opt/national-revival-desk/
          ln -s /opt/national-revival-desk/national_revival_desk deb/usr/bin/national-revival-desk
          cp app/linux/runner/resources/app_icon.png deb/usr/share/icons/hicolor/256x256/apps/national-revival-desk.png
          cat > deb/DEBIAN/control <<'EOF'
          Package: national-revival-desk
          Version: 4.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libstdc++6
          Maintainer: National Revival Desk
          Description: National revival coordination, planning, reporting and radio application.
          EOF
          cat > deb/usr/share/applications/national-revival-desk.desktop <<'EOF'
          [Desktop Entry]
          Name=National Revival Desk
          Exec=/opt/national-revival-desk/national_revival_desk
          Icon=national-revival-desk
          Type=Application
          Categories=Office;Utility;
          Terminal=false
          EOF
          dpkg-deb --build deb release/NationalRevivalDesk-v4.0.0-amd64.deb
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          tar -czf rpmbuild/SOURCES/national-revival-desk-4.0.0.tar.gz -C "$BUNDLE" .
          cat > rpmbuild/SPECS/national-revival-desk.spec <<'EOF'
          Name: national-revival-desk
          Version: 4.0.0
          Release: 1%{?dist}
          Summary: National revival coordination and reporting application
          License: Proprietary
          BuildArch: x86_64
          Source0: national-revival-desk-4.0.0.tar.gz
          Requires: gtk3
          %description
          National Revival Desk multi-platform application.
          %install
          mkdir -p %{buildroot}/opt/national-revival-desk %{buildroot}/usr/bin
          tar -xzf %{SOURCE0} -C %{buildroot}/opt/national-revival-desk
          ln -s /opt/national-revival-desk/national_revival_desk %{buildroot}/usr/bin/national-revival-desk
          %files
          /opt/national-revival-desk
          /usr/bin/national-revival-desk
          EOF
          rpmbuild --define "_topdir $PWD/rpmbuild" -bb rpmbuild/SPECS/national-revival-desk.spec
          find rpmbuild/RPMS -name '*.rpm' -exec cp {} release/NationalRevivalDesk-v4.0.0-x86_64.rpm \;
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp -a "$BUNDLE/." AppDir/usr/bin/
          cp app/linux/runner/resources/app_icon.png AppDir/national-revival-desk.png
          cp deb/usr/share/applications/national-revival-desk.desktop AppDir/national-revival-desk.desktop
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/national_revival_desk" "$@"
          EOF
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir release/NationalRevivalDesk-v4.0.0-x86_64.AppImage
          cat > release/LINUX_BUILD_STATUS.txt <<'EOF'
          Native Flutter Linux x64 build, portable archive, DEB, RPM and AppImage were compiled on Ubuntu.
          Runtime testing on the user's distribution and desktop environment remains required.
          EOF
          sha256sum release/* > release/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nrd-v4-linux
          path: release
          if-no-files-found: error

  apple:
    name: macOS DMG PKG and unsigned iOS archive
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create and validate Apple projects
        run: |
          set -euo pipefail
          flutter create --platforms=macos,ios --org com.nationalrevivaldesk --project-name national_revival_desk app
          cp nrd_v4/simple/pubspec.yaml app/pubspec.yaml
          rm -rf app/lib app/test
          cp -a nrd_v4/simple/lib app/lib
          cp -a nrd_v4/simple/test app/test
          cd app
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Build unsigned macOS and iOS outputs
        run: |
          set -euo pipefail
          mkdir -p release
          cd app
          flutter build macos --release
          flutter build ios --release --no-codesign
          cd ..
          APP="app/build/macos/Build/Products/Release/national_revival_desk.app"
          hdiutil create -volname "National Revival Desk" -srcfolder "$APP" -ov -format UDZO release/NationalRevivalDesk-v4.0.0-macOS-unsigned.dmg
          pkgbuild --component "$APP" --install-location /Applications release/NationalRevivalDesk-v4.0.0-macOS-unsigned.pkg
          ditto -c -k --sequesterRsrc --keepParent app/build/ios/iphoneos/Runner.app release/NationalRevivalDesk-v4.0.0-iOS-unsigned-Runner.zip
          cat > release/APPLE_BUILD_STATUS.txt <<'EOF'
          macOS application, DMG and PKG were genuinely compiled on macOS but are not Developer ID signed or notarized.
          The iOS Runner.app was genuinely compiled with --no-codesign and is not a normally installable IPA.
          Apple Developer certificates, provisioning profiles and notarization credentials are still required.
          EOF
          shasum -a 256 release/* > release/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nrd-v4-apple-unsigned
          path: release
          if-no-files-found: error
